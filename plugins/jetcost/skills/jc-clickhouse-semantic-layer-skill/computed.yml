    expression: ROUND(SUM(clicksProRataDs), 2)
  - name: impressionsProRataDs
    source: [sessions]
    expression: ROUND(SUM(impressionsProRataDs), 2)
  - name: clicksProRataMktg
    source: [sessions]
    expression: ROUND(SUM(clicksProRataMktg), 2)
  - name: impressionsProRataMktg
    source: [sessions]
    expression: ROUND(SUM(impressionsProRataMktg), 2)
  - name: clicksFullCore
    source: [searches, sessions]
    expression: SUM(clicksCore) + SUM(clicksMalCore)
  - name: revenueCurrentProRataFullCore
    source: [sessions]
    expression: SUM(revenueCurrentCore) + ROUND(SUM(revenueCurrentProRataMalCore), 2)
  - name: revenueCurrentFullCore
    source: [searches, impressions]
    expression: SUM(revenueCurrentCore) + SUM(revenueCurrentMalCore)

