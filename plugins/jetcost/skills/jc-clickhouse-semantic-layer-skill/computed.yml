  # STR decomposition — searchFrequencyRate and searchReach are the two factors of
  # STR: searchReach x searchFrequencyRate = STR. searchReach is how many sessions
  # search at all (engagement), searchFrequencyRate is how much those sessions search
  # (search depth). ICE impact models use the two factors by default and collapse to
  # STR only when an initiative hits the funnel undifferentiated — never apply a delta
  # to STR and to a factor in the same model.
  #
  # searchReach was called nonBounceRate until 2026-09, and still is in the ICE
  # framework skill and the jc-ice-evaluation project prompt; searchReach is the name
  # an analyst now sees in Superset. Same metric, two names.
  #
  # Both are rounded to 4 decimals like every other rate in this file, NOT to the 2
  # the Superset expressions use. Two decimals break the decomposition: on Aug 2026
  # web, 0.5823 x 1.7084 = 0.9948 against an STR of 0.9947, but 0.58 x 1.71 = 0.9918,
  # a -0.29% error that propagates straight into the ICE revenue formula the factors
  # feed. It also flattens the sub-point deltas ICE reasons about (+0.50pp, +0.0139).
  #
  # UNITS DIFFER, do not format them alike: searchReach is a proportion in [0,1] and
  # displays as a percentage; searchFrequencyRate is an average count per searching
  # session, routinely > 1 (app Aug 2026 = 3.07) and must NEVER display as a
  # percentage. Their product may legitimately exceed 100%.
  #
  # searchReachCar / searchReachFlight are searchReach for one product: same
  # denominator (ALL sessions, not the product's own), so they do NOT sum to
  # searchReach — a session searching both products counts in both. They were named
  # sessionsWithSearchCar % / sessionsWithSearchFlight % until 2026-09, renamed with
  # searchReach itself to match Superset. searchFrequencyRate has no product
  # declination here.
  - name: searchFrequencyRate
    source: [sessions]
    expression: if(SUM(sessionsWithSearch) = 0, 0, ROUND(SUM(searches)/SUM(sessionsWithSearch), 4))
  - name: searchReach
    source: [sessions]
    expression: if(SUM(sessions) = 0, 0, ROUND(SUM(sessionsWithSearch)/SUM(sessions), 4))
  - name: searchReachCar
    source: [sessions]
    expression: if(SUM(sessions) = 0, 0, ROUND(SUM(sessionsWithSearchCar)/SUM(sessions), 4))
  - name: searchReachFlight
    source: [sessions]
    expression: if(SUM(sessions) = 0, 0, ROUND(SUM(sessionsWithSearchFlight)/SUM(sessions), 4))
  - name: sessionsWithClickCoreCar %
    source: [sessions]
    expression: ROUND(SUM(sessionsWithClickCoreCar)/SUM(sessions), 4)
  - name: sessionsWithClickCoreFlight %
    source: [sessions]
    expression: ROUND(SUM(sessionsWithClickCoreFlight)/SUM(sessions), 4)
