      # --- route and booking window of the user's first flight search --------
      # User-level, from etl2.user_property_jc_first_session_data, which carries
      # them for every first session since 2019-01-01. NULL when the user's first
      # session had no flight search — 37% of first sessions had one in 2021,
      # 9.6% in 2026.
      # ⚠️ SESSIONS FLOOR: 2025-01-01. On this datamart they are valued only on
      #    sessions dated on or after it, and NULL on every session dated before —
      #    0 sessions with a route in 2019-2024 — even for users whose first search
      #    is known: sessions were last re-run from 2025-01-01 (Oct 2026). So NULL
      #    means "no flight search" only from the floor on, and a time series
      #    across it jumps from 0: that is the re-run, not a trend. The floor moves
      #    only with a re-run (ClickUp 1244errpp3t, RE-RUN 2027, may take it back
      #    to 2019-02); check it with "SELECT min(date) FROM
      #    datamart.jc_sessions_datamart_view WHERE
      #    firstSessionFirstFlightSearchIataFrom IS NOT NULL". The date is repeated
      #    below and in computed.yml, on
      #    firstSessionFirstFlightSearchBookingWindowClustered: move all together.
      # ⚠️ COHORT METRICS: FLOOR THE COHORT, NOT THE DATES. In ARPU, retention or
      #    any metric that sets a cohort's later sessions against its first
      #    sessions, filtering or breaking down by one of these columns (or by
      #    firstSessionFirstFlightSearchBookingWindowClustered) REQUIRES
      #    firstSessionDate >= '2025-01-01'. Without it, a user whose first session
      #    predates the floor has a NULL first session — out of the denominator —
      #    and valued sessions from 2025 on — in the numerator: revenue without an
      #    install. A date filter does not help, because no session is dated
      #    before its firstSessionDate: the leak is which cohorts enter, not which
      #    days. Measured 2026-10-12 on
      #    CountryFrom = 'FR', cohorts from 2024-10-12: ARPU inflated +0.6% at D15,
      #    +1.4% D30, +4.4% D90, +8.3% M6 — the longer the window, the more
      #    pre-floor cohorts reach past the floor. The ARPU dashboard in
      #    meta-funnel-dashboard (dashboards/arpu/query.js, FIRST_SEARCH_FROM)
      #    applies exactly this.
      # ⚠️ countryFrom/countryTo are in GB code space ('GB', never 'UK'), unlike
      #    the session's own `country`. See the glossary.
      - column_name: firstSessionFirstFlightSearchCountryFrom
