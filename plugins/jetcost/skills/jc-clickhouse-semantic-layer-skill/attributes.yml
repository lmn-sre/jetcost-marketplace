  # ============================================================
  # USERS DATAMART
  # ============================================================
  # Grain: Pre-aggregated unique user counts by dimensions and funnel step
  # Table: datamart.jc_users_datamart
  #
  # ⚠️ WHEN TO USE THIS DATAMART
  #   Use EXCLUSIVELY when the user asks a USER-BASED question
  #   (e.g., "how many users", "unique visitors", "new vs returning users",
  #    "user funnel", "user counts by step").
  #   For all other questions, use the main funnel datamarts.
  #
  # ⚠️ FULLY INDEPENDENT — does NOT participate in the dimension hierarchy.
  #   Does NOT inherit dimensions from sessions/searches/clicks/impressions.
  #   ALL available dimensions are listed explicitly below.
  #
  # ⚠️ MANDATORY FILTERS:
  #   1. ALWAYS filter by `timeGrain` (Daily / Weekly / Monthly)
  #      Without this, counts are DUPLICATED and meaningless.
  #   2. ALWAYS filter by `step` to specify the funnel stage.
  #
  # The `users` column is ALREADY a pre-aggregated count.
  # Use SUM(users) to aggregate across dimensions.
  #
  # --- timeGrain ---
  #   values: [Daily, Weekly, Monthly]
  #
  # --- step (funnel stages) ---
  #   values: [01. Session Qualified,
  #            02. Flight Search,
  #            03. Flight Impression Detail Page,
  #            04. Flight Click Core, 05. Flight Booking]
  #
  # --- isFirstUser ---
  #   values: [true, false]  (new vs returning user)
  #
  # --- firstSessionDate ---
  #   Date of the user's very first session (lifetime).
  #
  # --- Attribution: last-click-not-direct ---
  # lastClickNotDirectCampaign{PaidVsNotPaid|Source|Medium|ChannelGroup}
  #
  # --- Attribution: first session — campaign channel ---
  # firstSessionSessionCampaign{PaidVsNotPaid|Source|Medium|ChannelGroup}
  #   Attribution data from the user's very first session (campaign/marketing channel).
  #
  # --- Attribution: first session — content channel ---
  # firstSessionSessionContent{PaidVsNotPaid|Source|Medium|ChannelGroup}
  #   Attribution data from the user's very first session (content/product channel).
  #
  # --- User-level rank/cumulative (for segmentation) ---
  # Same semantics as in other datamarts (e.g., userSessionRankPerUser = nth session for this user).
  # Use these to segment users (e.g., "users with at least 3 sessions").
  # ============================================================
  users:
    dimensions:
      # --- Users-specific dimensions ---
      - column_name: timeGrain
      - column_name: step
      - column_name: isFirstUser
      - column_name: pagesNameList                    # Array(String): pages (web) / screens (app) of ALL the user's sessions in the period plus the day before it (not only qualified ones, whatever the step); each session opens with the fake page 'session_start', so a session without tracked pages is just 'session_start'. Sessions in chronological order (session id), pages in their in-session order — ⚠️ only on rows written after the 2026-10-13 deploy (insertDateTime >= '2026-10-14', jetcost-bi 0c72d87d): older rows, i.e. almost all the history, have the sessions in arbitrary order, so has(pagesNameList, 'x') is fine everywhere but positional reads (pagesNameList[n]) and page sequences are not.
      # --- First session date ---
      - column_name: firstSessionDate
      # --- Temporal dimensions ---
      - column_name: date
      - column_name: year
      - column_name: quarter
      - column_name: yearQuarter
      - column_name: month
      - column_name: yearMonth
      - column_name: week
      - column_name: yearWeek
      # --- Geographic & market ---
      - column_name: country
      - column_name: macroArea
      - column_name: businessView
      - column_name: region
      - column_name: language
      - column_name: website
      - column_name: websiteType
      - column_name: businessProfile
      # --- Device & platform ---
      - column_name: context
      - column_name: device
      - column_name: deviceType
      - column_name: platform
      # --- Attribution (last-click-not-direct) ---
      - column_name: lastClickNotDirectCampaignPaidVsNotPaid
      - column_name: lastClickNotDirectCampaignSource
      - column_name: lastClickNotDirectCampaignMedium
      - column_name: lastClickNotDirectCampaignChannelGroup
      # --- Attribution (first session — campaign channel) ---
      - column_name: firstSessionSessionCampaignPaidVsNotPaid
      - column_name: firstSessionSessionCampaignSource
      - column_name: firstSessionSessionCampaignMedium
      - column_name: firstSessionSessionCampaignChannelGroup
      # --- Attribution (first session — content channel) ---
      - column_name: firstSessionSessionContentPaidVsNotPaid
      - column_name: firstSessionSessionContentSource
      - column_name: firstSessionSessionContentMedium
      - column_name: firstSessionSessionContentChannelGroup
      # --- User-level rank/cumulative ---
      # These characterise the USER at the point in time captured by the row.
      # They follow the same semantics as in other datamarts:
      # *RankPerUser = N-th occurrence of that event in the user's lifetime.
      # *CumulativePerUser = total accumulated value across the user's lifetime.
      # Typical use: segment users by lifecycle stage, e.g.:
      #   WHERE userSessionRankPerUser = 1 → first-ever session users only
      - column_name: userSessionRankPerUser          # N-th session for this user (lifetime)
      - column_name: userSearchRankPerUser           # N-th search (any product) for this user (lifetime)
      - column_name: userSearchFlightRankPerUser     # N-th flight search for this user (lifetime)
      - column_name: userSearchCarRankPerUser        # N-th car search for this user (lifetime)
      - column_name: userSearchDpRankPerUser         # N-th dynamic-package search for this user (lifetime)
      - column_name: userClickRankPerUser            # N-th click (any type) for this user (lifetime)
      - column_name: userClickCoreRankPerUser        # lifetime Core (clickCategory 1001) clicks for this user
      - column_name: userClickNotCoreRankPerUser     # lifetime clicks of ONE non-Core clickCategory for this user — NOT their total non-Core clicks (see FAMILY-SCOPED COLUMNS)
      - column_name: userRevenueCumulativePerUser    # cumulative total revenue for this user (lifetime)
      - column_name: userRevenueCoreCumulativePerUser   # cumulative core revenue for this user (lifetime)
      - column_name: userRevenueNotCoreCumulativePerUser  # cumulative revenue of ONE non-Core clickCategory for this user (lifetime) — not of all their non-Core clicks
      - column_name: userConversionRankPerUser          # N-th conversion (booking) for this user (lifetime)
      - column_name: userCommissionValueCalculatedCumulativePerUser  # cumulative calculated commission for this user (lifetime)