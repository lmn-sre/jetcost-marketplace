      - column_name: revenueCurrentProRataTotal
      # Marketing pro-rata: GAds, Ds, NotSem and their Mktg total. The *Mktg and
      # *GAds ones already sum the performance_marketing_cps and ads_geo_cps slices,
      # which never overlap (GAds moved to the geo pipeline on 2026-01-01).
      # NotSem has the cost only: its clicks and impressions are counted in
      # clicksProRataMktg and impressionsProRataMktg.
      # Context: cost lands on web sessions only, with two exceptions.
      #   - App-install campaigns (web_vs_app = 'app' in the campaign registry):
      #     on the app sessions carrying the campaign. GAds from 2026-09-07.
      #     NotSem from 2026-10-26, today Apple Ads only (sessionCampaignSource =
      #     'apple'): its spend starts 2026-10-22, but the app writes the Apple Ads
      #     campaign in sessionCampaign only from 2026-10-26, so the 22-25 Oct
      #     spend reaches no session. Device: iPhone -> phone, iPad -> tablet; a
      #     campaign-day Apple does not split by device goes to phone.
      #     A campaign-day with no matching app session drops out of this datamart
      #     (2.86 of 20.71 EUR of Apple Ads on 2026-10-26).
      #   - OIA campaigns (oia flag in the registry, sessionCampaignIsOia): the ad
      #     opens the app when installed, the web otherwise, so the cost of each
      #     (date, device, campaign) tuple (+ countryUser from 2026) is spread over
      #     its web AND app sessions with one cost per session. This includes app
      #     sessions reached through the web (appOpeningWebOrigin = true: W2A or
      #     the /oia/ redirect), which for any other campaign read 0. They take
      #     about a quarter of OIA app cost in 2026 and 40-50% in 2023-2025.
