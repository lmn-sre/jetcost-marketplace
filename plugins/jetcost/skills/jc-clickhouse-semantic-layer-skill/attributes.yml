  # ============================================================
  # IMPRESSIONS DATAMART — see IMPRESSION-LEVEL SPECIFICS in glossary above
  # Table: datamart.jc_impressions_datamart
  # Grain: Impression-level (each row = one itinerary displayed to a user)
  # Inherits dimensions from searches + sessions (parallel to clicks), EXCEPT
  # the ones listed under `not_inherited_dimensions` below.
  # ============================================================
  impressions:
    # Dimensions that the searches/sessions inheritance would otherwise imply,
    # but which do NOT exist on this table. Confirmed against both ClickHouse
    # and raw_catalog (which maps these columns to jc_searches_datamart and
    # jc_clicks_datamart only) — impressions carries no search-grain rank.
    # Querying any of these against impressions fails.
    #   *RankPerUser    → use the userSearch*RankPerUser form instead, which IS
    #                     present here (user-lifetime scope, see RANK DIMENSIONS)
    #   *RankPerSession → no equivalent on impressions at all
    #   *CountryCluster → physical on the sessions view only (see the Country
    #                     cluster block under sessions); nothing equivalent here
    #   firstSessionFirstFlightSearch* → physical on the sessions tables only;
    #                     for the route of the current search use the bare
    #                     countryFrom/iataFrom/... columns
    # semantic-checker reads this list (agents/semantic-checker/clickhouse-coverage.js)
    # and validates it: an entry that turns up on the table, or that no ancestor
    # actually declares, is reported as a finding rather than silently honoured.
    not_inherited_dimensions:
      - searchRankPerUser
      - searchFlightRankPerUser
      - searchCarRankPerUser
      - searchDpRankPerUser
      - searchRankPerSession
      - searchFlightRankPerSession
      - searchCarRankPerSession
      - searchDpRankPerSession
      - sessionCampaignCountryCluster
      - userBasedCampaignCountryCluster
      - lastClickNotDirectCampaignCountryCluster
      - firstSessionFirstFlightSearchCountryFrom
      - firstSessionFirstFlightSearchCountryTo
      - firstSessionFirstFlightSearchIataFrom
      - firstSessionFirstFlightSearchIataTo
      - firstSessionFirstFlightSearchIataFromParent
      - firstSessionFirstFlightSearchIataToParent
      - firstSessionFirstFlightSearchBookingWindow
    dimensions:
      # --- Impression classification ---
      - column_name: impressionType
      - column_name: impressionSubType
