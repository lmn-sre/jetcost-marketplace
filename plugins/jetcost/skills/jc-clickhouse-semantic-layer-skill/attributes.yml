      # userBasedCluster is a SIX-value enum:
      #   '01. New Paid' | '02. Returning Paid' | '03. Marketing-Driven'
      #   '04. New Notpaid' | '05. Returning Notpaid' | '99. Unconsented'
      #
      # userBasedClusterDebug carries one of 13 numbered branches (+96-99 for
      # Unconsented and Unidentified, below) that explain which rule produced the
      # cluster. Verified against datamart.jc_sessions_datamart_view, last 7 days
      # (2026-08-26). The 96-99 branches are checked first; then two top-level
      # cases:
      #
      # CASE A — the CURRENT session is itself a W2A (web-to-app) session, i.e.
      # this app opening came from a web-to-app crossover with its web ids
      # (appOpeningWebOriginType = 'Consented'). The cluster reads
      # the underlying WEB session's data (this file's `appOpeningWeb*` /
      # `firstSessionSessionCampaign*` prefix family above), not the app
      # session's own:
      #   01. W2A - New Paid          -> that web session is the user's first,
      #                                   and paid
      #   02. W2A - New Notpaid       -> that web session is the user's first,
      #                                   and not paid
      #   03. W2A - Returning Paid    -> not the user's first web session,
      #                                   current one paid
      #   04. W2A - Marketing-Driven  -> not first, current web session not
      #                                   paid, but the user's actual first
      #                                   session (firstSessionSessionCampaign*)
      #                                   was paid
      #   05. W2A - Returning Notpaid -> not first, current web session not
      #                                   paid, first session not paid either
      #
      # CASE B — the current session is NOT W2A (plain web, or native app not
      # tied to a fresh install):
      #   06. !W2A - New Paid          -> isFirstSession, sessionCampaign paid
      #   07. !W2A - New Notpaid       -> isFirstSession, sessionCampaign not
      #                                    paid
      #   08. !W2A - Returning Paid    -> not first, sessionCampaign paid
      #   returning + current not paid splits further on whether the user's
      #   OWN first-ever session was itself a W2A install:
      #   12. !W2A - Marketing-Driven  -> first session not W2A, and
      #                                    firstSessionSessionCampaign was paid
      #   13. !W2A - Returning Notpaid -> first session not W2A, and
      #                                    firstSessionSessionCampaign not paid
      #   ...or, if the user's first-ever session WAS a W2A install (a Consented
      #   one: an Unconsented or Unidentified first install has already sent
      #   every session of the user to 99), the model
      #   chases the install chain up to 2 levels back before giving up,
      #   looking at the `firstAppOpeningWeb*` / `firstAppOpeningFirstWeb*`
      #   prefix family (the web session(s) behind that first-ever install):
      #   09. !W2A - W2A Install via paid       -> the web session that drove
      #                                             the first-ever install was
      #                                             paid
      #   10. !W2A - W2A Install via first paid -> that web session wasn't
      #                                             paid, but ITS OWN first
      #                                             session was
      #   11. !W2A - W2A Install via not paid   -> neither was paid ->
      #                                             Returning Notpaid
      # Each branch also fixes which session's campaign/date populate
      # `userBasedCampaign*`/`userBasedFirst*`: the session actually credited
      # by that branch (current session for 01/02/06/07/08, first session for
      # 03/04/05/12/13, and the relevant web session in the install chain for
      # 09/10/11).
      #
      # '99. Unconsented' is APP-ONLY (exactly zero rows on platform = 'web'). A
      # session lands here when its web-to-app origin type is 'Unconsented' (consent
      # denied, only the muk arrived) or, from 2026-09-02, 'Unidentified' (only a
      # w2a code arrived): the web origin is known, the W2A chain cannot be
      # resolved, and neither paid/notpaid nor new/returning can be assigned. The
      # label says Unconsented, but read the bucket as "W2A not resolvable".
      # userBasedCampaign* and userBasedFirst* are NULL here. Its
      # userBasedClusterDebug is one of exactly four values, in precedence order,
      # which say which origin-type column triggered it:
      #   '99. Unconsented - appOpeningWebOriginType'       -> appOpeningWebOriginType
      #                                                        = 'Unconsented'
      #   '97. Unidentified - appOpeningWebOriginType'      -> appOpeningWebOriginType
      #                                                        = 'Unidentified'
      #   '98. Unconsented - firstAppOpeningWebOriginType'  -> only the first-opening
      #                                                        one is 'Unconsented'
      #   '96. Unidentified - firstAppOpeningWebOriginType' -> only the first-opening
      #                                                        one is 'Unidentified'
      # The two first-opening values catch EVERY app session of that user, Consented
      # or paid ones included, so the bucket grows with the user base behind it.
      # It first appears 2025-07 (0.06% of app sessions), ramps through 2025-08
      # (0.64%), and is stable from 2025-09 at ~3.9-4.9%. Last 30d to 2026-08-23:
      # 4.2% of app sessions and 4.6% of app revenueCurrentProRataTotal (0.2% and
      # 1.3% of the all-platform totals). 'Unidentified' adds roughly 0.8 points of
      # app sessions from 2026-09 (estimated on 2026-09-01..23), so a series of this
      # bucket crossing 2026-09-02 steps up. Its costProRataMktg is not 0: app-install
      # campaigns carry cost on app sessions (GAds from 2026-09-07, Apple Ads from
      # 2026-10-26), OIA campaigns from the October 2026 restatement (see the
      # marketing pro-rata block below), and 99 absorbs the unresolvable ones (13.6%
      # of OIA app sessions, 2026-09-07..10-04).
      # 03-05 are no longer exactly 0 either: a handful of OIA app sessions (~130 in
      # the same four weeks) fall into them.
      # ⚠️ Any breakdown by userBasedCluster MUST include this value or state
      # explicitly that it is excluded. The ROAS Pro Rata / roasProRata families in
      # computed.yml cover all six and are exhaustive; a hand-written breakdown, and
      # any breakdown on searches / clicks / impressions, still has to remember it.
      # Present on sessions, searches, clicks and impressions. searches and clicks
      # additionally carry a residual '' (empty) bucket of a few dozen rows/day.
      - column_name: userBasedCluster
