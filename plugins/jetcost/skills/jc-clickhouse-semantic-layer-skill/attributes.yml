      # build joins etl2.modeled_jc_app_openings_data on webSession = sessionId, so
      # they sit on web rows, never on app rows. CONSENT-ONLY BY CONSTRUCTION — that
      # join key is filled only when the W2A handoff carried the web identifiers,
      # i.e. only for webOriginType = 'Consented' (checked on the full table history:
      # a non-null webSession appears outside 'Consented' on 100 rows lifetime, all
      # <= 2025). Two consequences to state whenever these are reported:
      #   - they UNDERCOUNT real W2A volume. The unconsented 'muk' fallback exists
      #     since 2025-07-24 and is 32% of consented + unconsented openings in 2026;
      #     before that date unconsented openings fell into 'webOriginFalse' and are
      #     not measurable at all. 'Unidentified' openings (w2a code only, from
      #     2026-09-02) carry no web session either and are missing too.
      #   - 'Consented' means the web ids were propagated, not that a consent record
      #     was verified: ~0.6% of these openings land on sessions with every
      #     iubenda* NULL (no consent record at all, mostly FR/IT/US).
      # Exactly = fromWebFirstAppOpenings + fromWebReAppOpenings (landedType has only
      # those two values). Aggregate with SUM. ~29-41k/month, May-Aug 2026.
