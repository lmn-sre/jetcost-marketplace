# ============================================================
# GLOSSARY — read this to understand column naming conventions
# ============================================================
# Columns are COMPOSITIONAL. Most follow the pattern:
#   [scope_prefix] + [campaign_layer] + BaseAttribute
#
# Example: firstAppOpeningFirstWebSessionCampaignCampaignType
#   = firstAppOpeningFirstWeb (scope) + sessionCampaign (campaign) + CampaignType (attr)
#
# --- ATTRIBUTION MODELS --------------------------------------
# Three models to attribute traffic (each ends with "Campaign" in column names):
#   sessionCampaign        → in-session attribution (current session)
#   userBasedCampaign      → custom in-house user-level attribution
#   lastClickNotDirectCampaign → standard last non-direct click attribution
#
# In-session model has two channels:
#   sessionCampaign → marketing channel (paid ads, SEO, direct, etc.)
#   sessionContent  → product channel (internal content-driven traffic)
#     same sub-attributes as sessionCampaign but without "Campaign" in the name
#     (e.g., sessionContentChannelGroup, not sessionContentCampaignChannelGroup)
#
# Each channel has the same sub-attributes, derived from internal
# "anagrafica marketing" tool (cascading taxonomy):
#   PaidVsNotPaid → paid vs free (binary, highest level)
#   ChannelGroup  → high-level grouping (paid-search, organic, direct, social, ...)
#   TrafficType   → mid-level breakdown
#   CampaignType  → most granular classification (brand, generic, remarketing, ...)
#   + Source, Medium, IsOia, LocalVsExt, CountryDetail, Product
#
# Source and Medium are read from the same campaign registry as the other
# sub-attributes. Their former *SourceInternal / *MediumInternal twins (e.g.
# sessionCampaignSourceInternal, userBasedCampaignMediumInternal) were retired
# on 2026-09-29 (ClickUp 1244errmn2g): never query them, even while the
# physical columns are still on the tables — use *Source / *Medium instead.
#
# --- TEMPORAL PREFIXES ---------------------------------------
# firstSession → user's very first session (lifetime)
#   Applied to any attribution or dimension to get its "first-ever" value.
#
# --- TEMPORAL DIMENSIONS (date granularities) ----------------
# The primary key is `date` (daily). For non-daily aggregations use
# (formats checked against the tables on 2026-10-13):
#   year           → e.g., 2025
#   quarter        → quarter number (1-4)
#   yearQuarter    → UInt32 year*100 + quarter, e.g., 202501 = 2025 Q1 (not '2025-Q1')
#   month          → month number (1-12)
#   yearMonth      → UInt32 YYYYMM, e.g., 202501 (not '2025-01')
#   week           → Sunday-based week number (1-53), NOT ISO: Monday
#                    2026-10-05 is week 40 here and ISO week 41
#   yearWeek       → UInt32 YYYYWW, Sunday-based (WEEK CONVENTION in SKILL.md),
#                    e.g., 202640. The week across 1 January goes to the year
#                    holding at least 4 of its days, so the YYYY can differ from
#                    year(date) both ways: 2026-01-01 → 202553, 2024-12-29 → 202501
#   weekDay        → lowercase day name ('sunday', 'monday', ...)
#   weekDayNumber  → 0=Sunday, 1=Monday, ... 6=Saturday
#
# ⚠️ There is NO startOfWeek column on any of the five datamarts. For the date
#    the week starts on, use toStartOfWeek(date, 6): mode 6 starts on Sunday
#    and maps one-to-one onto yearWeek (checked on every week 2019 → 2026).
# Not every granularity is on every datamart — weekDay and weekDayNumber are
# absent from users. Each datamart's `dimensions` list below is the reference.
#
# The scope prefixes carry Date, Year, Quarter, YearQuarter, Month, YearMonth,
# Week and YearWeek only (no WeekDay / WeekDayNumber), on sessions, searches,
# clicks and impressions:
#   firstSession*         → e.g., firstSessionYearMonth
#   userBasedFirst*       → e.g., userBasedFirstYear
#   appOpeningWeb*        → e.g., appOpeningWebQuarter
#   (and all other cross-device prefixes)
#
# --- CROSS-DEVICE PREFIXES (W2A = web-to-app) ----------------
# Handle users switching between app and web.
#   appOpeningWeb              → current web session after current app opening
#   appOpeningFirstWeb         → first web session after current app opening
#   firstAppOpeningWeb         → current web session after first-ever app opening
#   firstAppOpeningFirstWeb    → first web session after first-ever app opening
#
# --- METRIC BUILDING BLOCKS ----------------------------------
# Revenue has three dimensions:
#
# Revenue stream (business line):
#   Core      → core CPC/CPA revenues (flight comparison clicks)
#   MalCore   → MAL tool revenues competing with core offers (same placement)
#   MalMedia  → MAL tool revenues on dedicated media placements (checkbox, inline ads, etc.)
#     ⚠️ The MalCore/MalMedia split is derived from clickCategory during the ETL
#        (1001 = Core, 3003 = Mal Core, everything else = Mal Media) and is NOT
#        uniformly available. Verified against system.columns:
#          clicksMalCore / clicksMalMedia          → searches, sessions, impressions
#          revenueCurrentMalCore / ...MalMedia     → searches, impressions ONLY
#          revenueCurrentProRataMalCore            → sessions (view), pro-rata allocated
#          revenueEcpc* / revenueOperational*      → NO MalCore/MalMedia split at all,
#                                                    only the combined Mal
#        So on sessions the MAL Core clicks are a real count, while the MAL Core
#        revenue is available only in its pro-rata form.
#        The unsuffixed Mal columns (revenueCurrentMal, revenueEcpcMal,
#        revenueOperationalMal) DO exist at every grain — they are MalCore +
#        MalMedia combined, which on searches is in practice MAL Core plus the
#        inline unit: the exit unit never has a search to attach to, the
#        inline essentially always does (R023 in query-rules.yml).
#        Do not assume the three precision variants agree on a MAL aggregate: they coincide per click, but not once summed
#        to session grain.
#        ⚠️ On sessions, MAL revenue is revenueCurrentProRataMal — NOT
#        revenueCurrentMal, which is present in the table but is a sum of click
#        bids, and has been removed from the Superset dataset. See R019 in
#        query-rules.yml before reading any MAL revenue at session grain.
#        And none of these columns exist on jc_clicks_datamart: that datamart
#        carries raw clickCategory instead, so filter on it there.
#   Media     → display advertising via GAM/AFS/similar ad-serving tools
#   Mal       → MalCore + MalMedia combined
#   (no suffix) → all streams combined
#
# Precision vs speed (from fastest to most accurate):
#   Ecpc        → calculated via ECPC calculator
#   Operational → sent to marketing in real-time (commissionValue for CPA partners if available, ecpc otherwise)
#   Current     → delayed 1-2 days, more accurate
#   Actual      → derived from invoicing (most accurate, slowest)
#   ⚠️ The ladder is a CORE fact. On a MAL click (clickCategory != 1001) the
#      variants carry the same value: revenueCurrent = revenueOperational on
#      every click, and = revenueEcpc from 2025-12-01 (before that, a 1-cent
#      per-click rounding difference on under 1% of MAL clicks). So on MAL,
#      Current is not more accurate than Ecpc — it is the winning bid. The
#      network-reported MAL figure is the pro-rata one on sessions (R019).
#
# Product vertical (suffix in METRIC NAMES, e.g. searchesFlight, amc3DynamicPackage):
#   Flight, Car, DynamicPackage → specific product
#   (no suffix) → all products combined
#   ⚠️ These spellings are metric-name suffixes ONLY. The `product` COLUMN uses
#      different literals — see its entry under KEY DIMENSIONS below.
#
# Model suffixes:
#   ModelCpc     → CPC commission model only
#   ModelCpa     → CPA commission model only
#   (no suffix)  → all models combined
#
# Cumulative metrics:
#   CumulativePerUser    → revenue accumulated across user lifetime
#   CumulativePerSession → revenue accumulated within a session
#   CumulativePerSearch  → revenue accumulated within a search
#
# --- KEY DIMENSIONS (with enum values) -----------------------
# country: 2-char market code
#   values: [AR,AT,AU,BO,BR,CA,CL,CO,DE,DK,ES,FI,FR,HK,HU,ID,IE,IN,IT,KR,MX,MY,NL,NO,NZ,PE,PH,PL,PT,RO,RU,SE,SG,TH,UK,US,UY,VE,ZA]
#   ⚠️ UK is the single non-ISO value: the UK market is 'UK' here, but 'GB' on the
#      route/car fields (countryFrom, countryTo, pickupCountry, dropoffCountry).
#      country = 'GB' returns ZERO rows. See R015 in query-rules.yml.
#      Same code space, same caveat: countryUser, firstSessionCountry,
#      firstSessionCountryUser, appOpening*Country, appOpening*CountryUser.
#   ⚠️ RU is decommissioned: no rows after 2026-07-06. A window spanning that
#      date shows it starting and stopping — a decommissioning, not a gap.
# region: GEOGRAPHIC grouping of countries, by continent — NOT the business lens
#   values: [AFRICA, APAC, EMEA, LATAM, NORAM]
#   ⚠️ A request for "macroarea" / "macro-area" / "macro area" means macroArea
#      below, NEVER region. Use region only when the question is explicitly
#      geographic (continent). The two disagree on several markets: MX is
#      NORAM here but Rest of the World in macroArea; UK is EMEA here but
#      English speaking there; AU/NZ are APAC here but English speaking there.
#   Not the same thing as the macro-region in SEM campaigns' GEO field either,
#   which groups route origins/destinations, not markets.
# macroArea: the BUSINESS grouping of markets — how Jetcost observes the business
#   values: [English speaking, Europe, Rest of the World]
#   English speaking  = US, CA, UK, AU, NZ
#   Europe            = every European market except UK — IE included, even
#                       though it is English-language
#   Rest of the World = LATAM, MX, APAC except AU/NZ, ZA, RU
#   Same code space and same caveat on the prefixed variants (firstSession*,
#   appOpening*, firstAppOpening* ...MacroArea).
# businessView: macroArea with the six main markets split out
#   values: [TOP 6 - English speaking, TOP 6 - Europe, English speaking, Europe,
#            Rest of the World]
#   TOP 6 - English speaking = US, UK; TOP 6 - Europe = IT, FR, ES, DE; every
#   other market keeps its macroArea value. Rolls up exactly into macroArea.
# region, macroArea and businessView all come from the same per-country
# dictionary (config.dict_country), written as physical columns by the ETL:
# one value per country, never per session.
# language: 2-char code
#   values: [da,de,en,es,fi,fr,hu,it,ko,nb,nl,pl,pt,ro,ru,sv]
#   ⚠️ Norway is 'nb' (Bokmål), never 'no'. Denmark 'da', Sweden 'sv'.
#   ⚠️ country and language are NOT independent: a market is the (country,
#      language) tuple, and only 40 of the 38x15 combinations exist. Every
#      country has exactly ONE language except CA (en + fr) and US (en + es),
#      where the second is ~48% and ~41% of the market and has materially
#      different paid economics. Grouping US or CA by country alone merges two
#      segments that should be read apart — always add language for those two.
#      See core/business/markets.md in the domain bundle.
# businessProfile → websiteType → website: three NESTED fields, widest first —
#   the business model, the property layer inside it, the single property.
#     businessProfile  websiteType          website
#     jetcost          jetcost              jetcost             (core site, ALL markets)
#                      whitelabel           one value per white-label domain
#                      app                  jetcost-mobile-app  (ALL markets)
#     veriflights      veriflights          veriflights         (since 2026-02-24)
#     meta-spinner     multi-destinations   multi-destinations  (since 2026-06-24)
#   Same values on every datamart, except impressions, which carries the
#   jetcost profile only. Default scope is jetcost only (R012).
#   On searches only, ~15k searches since 2023 carry all three fields (and
#   country) empty; R012 drops them, which is correct.
#   ⚠️ website NEVER splits the core site or the app by market: every
#      per-market domain collapses into 'jetcost'. Use country. Only
#      white-label rows carry one value per domain.
#   ⚠️ websiteType = 'app' and context = 'app' are EXACTLY the same set
#      (verified 2023-01 → 2026-09), so websiteType only refines the web side.
#      For web vs app use context.
#   ⚠️ A profile's name is not its websiteType: meta-spinner is
#      'multi-destinations', so websiteType = 'meta-spinner' returns ZERO rows.
#   See data/dimensions.md and core/business/whitelabels.md in the domain bundle.
# context: web vs app
#   values: [app, web]
# platform: os-level
#   values: [android, ios, web]
# deviceType: high-level device cluster (tablet/connected_tv → desktop)
#   values: [app, desktop, mobile]
# qualifiedSession: boolean, the session filter every metric runs on (R002)
#   values: [true, false]
#   Business definition (what qualification removes and why): core/business/funnel.md
#   in the domain bundle.
#   Business profiles other than jetcost (veriflights, meta-spinner): always true.
#   jetcost: true when the session has a ga_client_id or Argo tracked at least one
#   page/screen view, except two cases where no Argo event of the session carries a
#   Tech consent (consentsTech), both from 2025-01-01:
#     - direct sessions, first or returning;
#     - the user's first session from referral or organic-search. Added on 2026-10-08
#       and restated back to 2025-01-01 by the October 2026 re-run.
#   ⚠️ Comparisons across 2025-01-01 mix two definitions. The referral / organic-search
#      exclusion alone is ~2.4% of jetcost qualified sessions in 2025 and ~2.7% in
#      Jan-Aug 2026, but about a third of organic-search and two thirds of referral
#      sessions (Jul-Aug 2026).
#   ⚠️ firstSessionQualifiedSession, firstAppOpeningFirstWebQualifiedSession and
#      appOpeningFirstWebQualifiedSession are a snapshot from the first-session
#      property, never restated: for first sessions 2025-01-01 → 2026-10-07 they keep
#      the definition without the referral / organic-search exclusion. They read true
#      where the session itself is now false on ~2.6% of a day's first sessions in
#      2025 and ~0.8% in 2026. For first sessions under the current definition use
#      qualifiedSession with isFirstSession (sessions).
# businessModel: partner commission model stamped on the click (clicks only)
#   values: [cpc, cpa, cpa%, rs, cpa_min_cpc, cpa%_min_cpc, bid, NULL]
#   cpa_min_cpc / cpa%_min_cpc: since 2026-05-01, revenue-wise they work like
#     cpa / cpa% (the floor is in minCpc).
#   bid: MAL external networks (clicktripz, kayak, viajala), since 2026-01-01.
#   amc3: LM only, discontinued 2024-07-09 in favour of cpa% — history only.
#   NULL: every click before 2024-06-12 (Core) and before 2026-01-01 (MAL).
#   ⚠️ There is NO commissionModel column (UNKNOWN_IDENTIFIER). The catalog's
#      "Commission Model" is the computed coalesce businessModel → ruleBusinessModel
#      in computed.yml — use it for any window before 2024-06-12.
#   See ruleBusinessModel under PARTNER/COMMERCIAL for how the two differ.
# businessView: see macroArea above
# product: Jetcost product vertical
#   values: [FLIGHT, CAR, DP]
#   ⚠️ Uppercase codes. 'Flight'/'DynamicPackage' are metric-name suffixes, NOT column
#      values — product = 'Flight' or 'DynamicPackage' returns ZERO rows.
#      DP (dynamic package) was active ONLY between 2023-07-19 and 2025-09-30 —
#      confirmed, not inferred. 58.5k searches over the whole window. There is no DP
#      data before or after it, while FLIGHT and CAR run to date.
#      So: a DP metric reading 0 for any recent period is EXPECTED, never an anomaly —
#      do not report it as a drop. A DP time series is only meaningful inside that
#      window, and a period straddling 2025-09-30 mixes active and inactive months.
#      Geography differs per product — see R016 in query-rules.yml.
#
# --- FIRST FLIGHT SEARCH DIMENSIONS --------------------------
# Attributes of ONE search, carried onto the user. Two scopes:
#   (no prefix)   → current search (searches/clicks/impressions datamarts)
#   firstSessionFirstFlightSearch*
#                 → first flight search of the user's FIRST session, lifetime
#                   (e.g., firstSessionFirstFlightSearchIataFrom). sessions ONLY.
#
# ⚠️ FLIGHT ONLY. The source is raw_jc.flys_search: car and dynamic package
#    searches never feed these columns, whatever the session's product mix.
#    A session that only searched cars has them all NULL.
#
# ⚠️ The Persona engine dimensions NO LONGER EXIST, in any scope and on any
#    datamart: persona, macroPersona, travelType, paxType, holidayType,
#    bookingType, periodType, haulType — neither bare, nor first*, nor
#    firstSessionFirstFlightSearch*. Never generate a query on them. For haul
#    type use the distance-based haulTypeDistanceCustom (< 1500 km short-haul,
#    < 3500 km medium-haul, beyond long-haul), which exists in
#    searches/clicks/impressions only: sessions has no haul dimension at all.
#
# Route and booking window:
# countryFrom / countryTo: ISO-2 of origin/destination country.
#   ⚠️ GB CODE SPACE: 'GB', never 'UK'. The session's own `country` uses the
#      Jetcost convention where GB is written UK. NEVER compare or join the two
#      without mapping, and never GROUP BY both expecting the same code.
# iataFrom / iataTo: airport IATA of the searched route
# iataFromParent / iataToParent: city-level parent (MXP → MIL, CDG → PAR).
#   NULL when the airport is not in config.dict_airport.
# bookingWindow: Int32, days between search date and departure date.
#   Can be NEGATIVE on dirty rows (~0.1%, min -1): filter >= 0 when bucketing.
#   For the clustered version see bookingWindowClustered in computed.yml.
#
# --- SEARCH DATE FLEXIBILITY (flexibleDates) -----------------
# flexibleDates: Nullable(String), attr 601 in raw_catalog. Positional code of
#   the date flexibility the user asked for: ONE DIGIT PER DATE BOUNDARY (0-3
#   days), read as a goDate pair followed by a backDate pair.
#     RT (isAr = true)  → 4 digits [go-, go+, back-, back+]
#         '1133' = goDate ±1 and backDate ±3   '0033' = goDate fixed, backDate ±3
#         '3300' = goDate ±3, backDate fixed   '3333' = ±3 on both
#     OW (isAr = false) → 2 digits [go-, go+]
#         '11' = goDate ±1                     '33' = goDate ±3
#   Digits are 0-3 only, and code length tracks trip type (4 ⇄ RT, 2 ⇄ OW) —
#   the all-zero codes below are the systematic exception. Populated for
#   product = 'FLIGHT' only, over the whole datamart history (non-NULL rows
#   since 2019-01-01, so no availability caveat on any window). Present on
#   searches, clicks and impressions.
#   NULL = no flexibility requested, i.e. a standard fixed-date search — the
#   large majority of flight searches, so expect a small absolute volume on the
#   flexible side of any split.
#   ⚠️ NULL is overloaded — it also means "not applicable": every CAR/DP row is
#      NULL. A flexible-vs-standard split MUST filter product = 'FLIGHT', or NULL
#      conflates fixed-date flight searches with non-flight ones.
#   ⚠️ NOT NULL is NOT the same as flexible: all-zero codes ('0000', '00') mean
#      zero flexibility on every boundary, and are also the only codes whose
#      length can contradict isAr ('0000' on OW rows, '00' on RT ones). Residual
#      volume, and absent from history before 2026-05-11.
#      So never classify on NULL — classify on the digits:
#        flexible → flexibleDates IS NOT NULL AND match(flexibleDates, '[1-3]')
#        standard → flexibleDates IS NULL OR NOT match(flexibleDates, '[1-3]')
#
# --- CONSENT DIMENSIONS --------------------------------------
# Seven Nullable(Bool) columns, declared on sessions and inherited by searches,
# clicks and impressions (absent from users). NOT a 1/0/empty string triple:
# compare with true/false, never with '1'/'0'/''.
#   ⚠️ THREE-STATE, and NULL is not a refusal. NULL = no consent state recorded
#      (question never answered, or never asked). So "refused" is `= false` and is
#      NOT the complement of `= true`: a share computed as 1 - granted folds the
#      unrecorded sessions into the refusals. Any consent split must decide
#      explicitly what to do with NULL.
#   ⚠️ Populated only since 2024-05-12 — every row before that date is NULL on all
#      seven, for coverage reasons, not because consent was refused. A consent
#      series crossing that date reads as a step change that isn't one.
#
# GDPR consents, collected via Iubenda (the cookie banner). The four move
# independently — a user can grant one and refuse another, so don't read any of
# them as a single "accepted the banner" flag:
# iubendaTech: technical/necessary consent. The portal can't run without it, so it
#   is NEVER false (verified over the whole populated history): it discriminates
#   "consent state recorded" (NOT NULL) from "nothing recorded" (NULL), nothing
#   more. Set exactly when the other three Iubenda ones are set.
# iubendaMktg: consent to marketing tracking
# iubendaDtra: consent to transferring data to third parties
# iubendaMeas: consent to tracking for measurement purposes
#
# Consents collected internally, NOT by Iubenda — the `iubenda` prefix on these
# three is a naming artefact of the four above, not a statement of origin:
# iubendaStrk: OS-level tracking permission (iOS App Tracking Transparency and the
#   Android advertising-ID equivalent). APP ONLY — a few dozen web rows exist over
#   the whole history and are noise; filter context = 'app' for any strk read.
# iubendaGloc: geolocation consent, app only — ALWAYS NULL, on every row of every
#   datamart since 2019. Forward-looking: the consent exists in the model but is
#   not being asked of users today, so nothing populates it. Never report it as
#   "consent refused" and never build a filter on it.
# iubendaWapn: push notification consent, web AND app (browser notification
#   permission on web, push permission in app — one consent, both contexts), so
#   this is the only one of the three meaningful on a web/app split.
#
# Business meaning of all seven, and what they gate downstream, lives in the
# business context skill's data/consents.md.
#
# --- CLICK-LEVEL SPECIFICS -----------------------------------
# clickCategory: click type code. 13 values — the authoritative taxonomy is the
#   ClickHouse dictionary `config.dict_click_category`, which exposes
#   clickCategoryMacroType / Type / SubType / Description / IsDeprecated. Resolve with
#   dictGet('config.dict_click_category', 'clickCategoryMacroType', tuple(clickCategory))
#   rather than hardcoding the codes below.
#   macroType Core        → 1001 (Regular Clickout Core), 5001
#   macroType Mal Core    → 3003 (MAL Promobox)
#   macroType Mal Media   → 2001*, 2002*, 2003 (Checkbox), 3001*, 3002*, 3004, 3005,
#                           3006 (Inline), 4001*, 4002 (Exit Unit)
#   (* = clickCategoryIsDeprecated — still present in historical data)
#   ⚠️ "Core clicks" means macroType 'Core' = clickCategory IN (1001, 5001). Filtering
#      on 1001 alone silently drops 5001. Route geography (countryFrom/countryTo) is
#      populated on Core clicks only — see R016 in query-rules.yml.
# searchTriggerSource: the UI entry point that started the search (searches/clicks)
#   Observed values, grouped (distinct on jc_searches_datamart, 2026-09):
#     form:         search_form
#     re-issued:    inactivity_refresh (web), default (web)
#     SERP intercards: nearby_dates_intercard, direct_dates_intercard,
#                   nearby_airports_intercard (app), inspirational_intercard
#     cards/content: airport_to_everywhere_card (web), airport_to_country_card (web),
#                   new_deals (web), theme_card (web), last_search_card (app),
#                   last_search_bell (app), offer_deal (app), content_card (app),
#                   travel_story_cta (app), bookmark (app)
#     external entry: travel_meta (web, metasearch landing), shared_link (web,
#                   sharing link — only since 2026-04-13), dynamic_link (app),
#                   apn (app push notification), oia (app)
#     navigators:   price_navigator (web), dates_navigator (web, since 2026-06-15)
#   '' and NULL are both present, on every platform: the entry point was not
#   tracked. Neither means search_form — keep them as their own bucket.
#   Not every value exists on every platform (see tags above): a web-only value
#   reads 0 on app by construction, never an anomaly.
#   e.g. "searches from the sharing link" → searchTriggerSource = 'shared_link'.
# searchTriggerSourcePage: page the entry point sat on
#   Observed values: home, results, airport_to_airport, airport_to, airport_from,
#   airport_to_everywhere, airport_to_country, airline, airlines, airports,
#   country_to, country_from, country_to_country, countries, flights, deals,
#   bookmarks, last_searches, shared_link, travel_story, themes, cms,
#   page_not_found, airport_not_found, country_not_found, wpn, default.
#   NULL whenever searchTriggerSource is ''/NULL, and on app entries with no page
#   (apn, oia, dynamic_link, content_card, part of Android search_form/bookmark).
# searchTriggerSourceDetail: optional qualifier of the entry point, NULL on most rows
#   app: which suggester fed the form — suggester_departure, suggester_arrival,
#        suggester_last_search, suggester_both
#   web: ar (round trip), ow (one way), direct — mostly on new_deals.
#        ar/ow track round trip vs one way (backDate NULL) closely but not
#        exactly; 'direct' does NOT match isDirect — don't read it as non-stop.
# Commission model: NOT a column — see businessModel under KEY DIMENSIONS and
#   the computed "Commission Model" in computed.yml.
# conversionType: type of partner conversion
#
# --- IMPRESSION-LEVEL SPECIFICS (impressions datamart) -------
# An impression = an ITINERARY DISPLAYED to a user on the SERP.
# A click = a specific OFFER clicked. One itinerary can have 1+ offers.
#
# ⚠️ LOW PRIORITY DATAMART: use impressions ONLY when the user
#    explicitly asks about displayed itineraries or SERP-level analysis.
#    For generic questions (revenue, clicks, partner perf) → use clicks.
#
# impressionType: type of displayed element
#   values: [itinerary_core, itinerary_cug, intercard, mal_promobox, minicar]
# impressionSubType: granular sub-type
#   values: [itinerary_core, itinerary_cug, intercard_not_found,
#            intercard_prices_nearby_dates, intercard_inspirational,
#            intercard_direct_dates, intercard_nearby_airports,
#            mal_promobox_inline, mal_promobox_sponsored_flight_itinerary,
#            mal_promobox_click_to_call, mal_promobox_right_column_flight_itinerary,
#            error, minicar]
#
# Hero offer (main offer on the itinerary card):
#   heroPartnerCode/heroGroupCode, heroUnitaryPrice/heroTotalPrice,
#   heroDiscountedUnitaryPrice/heroDiscountedTotalPrice, heroDiscount,
#   heroPaymentMethod/heroPaymentMethodFees*, heroPartnerQualityScore,
#
# Other offers (the competitors on the same card, below the hero):
#   otherOffers — the FULL array of offers (avg 4.6, max 22), one JSON string per
#     offer, hero excluded. Keys always present: offer_id, offer_type (core|cug),
#     partner_code, ranking_position (1..N, unique, no holes), unitary_price,
#     total_price, payment_method, payment_method_fees[{code,fee}].
#     Optional keys: is_airline, is_self_transfer, baggages_info{checked,cabin,hand},
#     discount, discounted_unitary_price, discounted_total_price,
#     is_sponsored, is_vi, is_vi_displayed.
#     A key can be present with a null value → always extract as Nullable.
#     Empty array before 2026-07-01 and for every non-itinerary impressionType.
#
# Promobox (MAL advertising):
#   promobox{PartnerId|PartnerName|NetworkId|NetworkName|Price|IataFrom|IataTo}
#     The network/partner pair of the MAL placement (see `network`/`networkPartner`
#     on clicks), but ONLY for impressionType = 'mal_promobox' — i.e. MAL Core.
#     Exit unit, inline and checkbox have no impression rows carrying these, so
#     impressions cannot answer a MAL Media question. Network names are TitleCase
#     here (ClickTripz, Mdflow, Kayak, Viajala) vs lower-case on clicks — never
#     join the two datamarts on the raw name.
#
# Clicked offer reference: clickedPartner / clickedGroupCode
#
# Metrics: values generated by that group of impressions
#   impressions, impressionsDetailPage, clicks, clicksCore, clicksMal,
#   revenue*, conversions, commissionValueCalculated*, amc3
#
# --- ROUTE/GEOGRAPHY (searches & clicks) ---------------------
# iataFrom/iataTo: IATA airport codes
# iataFromParent/iataToParent: parent IATA (city/metro level)
# airportFrom/airportTo: airport names
# countryFrom/countryTo: origin/destination country, ISO 3166-1 alpha-2
#   ⚠️ The UK is 'GB' on these fields, NOT 'UK' — countryFrom = 'UK' returns ZERO
#      rows. The market/user fields (country, countryUser) use 'UK' instead, so
#      never compare the two families on a shared literal. Same for pickupCountry
#      and dropoffCountry. See R015 in query-rules.yml.
# continentFrom/continentTo: origin/destination continent
# haulTypeDistanceCustom: haul class by route distance, FLIGHT only —
#   short-haul < 1500 km, medium-haul < 3500 km, long-haul beyond.
#   It is the ONLY haul dimension: haulTypeDistance (the source's own haul_type,
#   which had a 'domestic' class and often contradicted the distance) and the
#   Persona haulType no longer exist. For domestic vs international use isDomestic.
# clusterParentRoute: parent route cluster for aggregation
# distanceKm: route distance in km
#
# --- PARTNER/COMMERCIAL (clicks) -----------------------------
# partner: partner display name
# partnerCode: partner internal code
# partnerBrand: partner brand grouping
# groupCode: commercial group code
# groupInvoicing: invoicing entity
# ruleId/ruleValue/ruleBusinessModel: commercial rule details
# ruleBusinessModel: business model of the commercial rule the click matched.
#   Same values as businessModel, minus bid, plus amc3 (history); '' — never
#   NULL — when no rule matched: all MAL before 2026-01-01 and every MAL
#   external-network (bid) click.
#   vs businessModel: same meaning, different coverage. Where both are set they
#   agree on 99.9% of clicks; ruleBusinessModel goes back to 2019-01-01,
#   businessModel only to 2024-06-12. For the click's model, read businessModel
#   and fall back to ruleBusinessModel ("Commission Model" in computed.yml).
# network: MAL demand network. MAL clicks only (empty on Core). Four live:
#   mdflow (internal — Jetcost's own direct partner demand), clicktripz, kayak,
#   viajala. Populated from 2026-01-01 only.
# networkPartner: the advertiser that actually buys the MAL click and owns the
#   landing domain. Populated on 100% of MAL clicks from 2026-01-01, all networks
#   and all placements. This — NOT partnerCode — is the partner dimension for MAL:
#   groupCode/partnerCode exist only on the mdflow share (~50% of MAL Media,
#   ~69% of MAL Core), because the external networks are the commercial
#   counterpart, not the advertiser behind them. Case differs by network
#   (mdflow UPPER, external lower-case slugs) → lower() before grouping, and the
#   same buyer can arrive through several networks.
# integrationType / integrationSubType: how the clicked placement is integrated
#   (clicks only). One integrationType per clickCategory:
#     CORE        (1001) → STANDARD, BACKFILL, SPONSORED-DETAIL (since 2026-05-26)
#     PROMOBOX    (3003, MAL Core) → SPONSORED, INLINE-STATIC-PRICE,
#                 COMPARE-RIGHT-SHOULDER, CLICK-TO-CALL, RIGHT-COLUMN
#     TRAILINGTAB (4002, the exit unit) → STANDARD
#     INLINE      (3006) → STANDARD
#     CHECKBOX    (2003) → STANDARD — meta-spinner only, since 2026-06-24
#   EXITUNIT / FORM: 2 clicks in 2026-03, not a live placement.
#   ⚠️ NULL on EVERY MAL click (clickCategory != 1001) before 2026-01-01 —
#      the historical shape, not a gap; use clickCategory there. Core clicks
#      are populated over the whole history (2019-01-01).
#   ⚠️ CORE / BACKFILL is NOT a direct integration: offer content sourced from
#      another metasearch (KAYAK, VIAJALA; SKYSCANNER up to 2024-01), so groupCode
#      names the source, not a negotiated partner.
#   See core/commercials/integration-types.md in the domain bundle.
#
# --- ITINERARY DETAILS (searches & clicks) -------------------
# outbound/inbound + Airlines/Datetime/DurationMinutes/IataFrom/IataTo/Stops
# bestPrice/bestPartner: best offer in the search result
# cheapestTotalPrice/cheapestUnitaryPrice: cheapest displayed price
# price/totalPrice/unitaryPrice: click-level pricing
# isVi: Virtual Interlining offer (historical; from 2026-06-25 use isSelfTransfer for new data)
# isSelfTransfer: itinerary has ≥1 Virtual Interlining (self transfer) offer; replaces isVi/isViDisplayed (attr 1257, web since 2026-06-25)
# isDirect: direct flight
# isPinned: pinned/highlighted offer
#
# --- RANK DIMENSIONS -----------------------------------------
# Rank fields are ORDINAL COUNTERS: they express "this is the N-th occurrence
# of event X within context Y" for the current row.
# Example: searchRankPerSession = 3 means this is the 3rd search the user
# performed in the current session.
#
# Three context scopes:
#   *RankPerSearch  → counter resets at each search
#                     (e.g., clickRankPerSearch = 2 → 2nd click in this search)
#   *RankPerSession → counter resets at each session
#                     (e.g., searchRankPerSession = 1 → 1st search of this session)
#   *RankPerUser    → counter NEVER resets; monotonically increasing across the
#                     user's entire lifetime
#                     (e.g., clickRankPerUser = 47 → user's 47th ever click)
#
# Two naming prefixes:
#   (no prefix)    → event-scoped rank: the rank of the CURRENT event
#                    (e.g., clickRankPerSession = position of this specific click
#                     within the session)
#   user*RankPerUser → user-scoped rank: characterises the USER at session time,
#                      not a specific event
#                      (e.g., userSearchFlightRankPerUser = how many flight searches
#                       this user had made BEFORE the current session — useful for
#                       segmenting "first-time searchers" vs "experienced users")
#                      ⚠️ They EXCLUDE the current session, and they are a daily
#                      snapshot: userSessionRankPerUser = sessionRankPerUser - 1 on
#                      93.7% of rows and equals it on 0 of 4,059,348 (week
#                      2026-09-13→19); the rest lag further back. With no prior
#                      history userSessionRankPerUser reads 0, while every
#                      event-based one (userSearch*, userClick*, userConversion*,
#                      userRevenue*) reads NULL — on 100% of first sessions, and
#                      still on 33% (userSearchRankPerUser) to 90%
#                      (userConversionRankPerUser) of returning ones. That NULL is
#                      mostly a ZERO IN DISGUISE, not a coverage hole: on 90.5% of
#                      returning sessions the user IS in the snapshot
#                      (userSessionRankPerUser >= 1) and the event column is NULL
#                      anyway, because they have none of that event on record —
#                      164,311 such rows for searches, 222,183 for clicks, 567,920
#                      for conversions, a gradient that tracks how rare the event
#                      is. The other 9.5% are users the snapshot has not caught up
#                      with at all (userSessionRankPerUser = 0 on a session that is
#                      not their first); there the whole block is missing, not zero.
#                      So: read userSessionRankPerUser first to tell the two apart,
#                      then treat NULL as 0 — but note the inconsistency, because
#                      userSessionRankPerUser itself stores a real 0 for the same
#                      "nothing yet" case the others store as NULL.
#                      A first-ever flight search is therefore
#                      `userSearchFlightRankPerUser IS NULL AND
#                      searchFlightRankPerSession = 1` — never `= 1`, which selects
#                      users who already had exactly one before this session.
#                      ⚠️ The user* variants are NOT NULL-scoped by family — a
#                      Core click carries userClickNotCoreRankPerUser normally —
#                      but they are built from the click-level column, so they
#                      inherit its per-category counting (trap 2 below): they are
#                      a lifetime count of ONE clickCategory, not of the whole
#                      family. On sessions, userClickRankPerUser exceeds
#                      userClickCoreRankPerUser + userClickNotCoreRankPerUser on
#                      8.1% of rows (week 2026-09-13→19) — never the reverse.
#
# ⚠️ AVAILABILITY — the two prefixes do NOT cover the same datamarts:
#   user*RankPerUser  → available on ALL five datamarts (sessions, searches,
#                       clicks, impressions, users)
#   search*Rank*      → searches and clicks ONLY. The event-scoped search ranks
#                       are absent from impressions, which carries no search-grain
#                       rank at all — for the *PerUser ones use the user* form
#                       instead; the *PerSession ones have NO equivalent there.
#   This exception is declared as `not_inherited_dimensions` under the impressions
#   datamart below, so the coverage check knows about it too.
#
# Event types covered:
#   session*    → session occurrences for the user
#   search*     → all searches (searchRankPerSession/User)
#   searchFlight* → flight-specific searches
#   searchCar*    → car-specific searches
#   searchDp*     → dynamic-package searches
#   click*      → all clicks
#   clickCore*  → clicks with clickCategory = 1001 only (NULL on every other click)
#   clickNotCore* → clicks with clickCategory != 1001, counted PER CATEGORY
#                   (NULL on Core clicks — see FAMILY-SCOPED COLUMNS below)
#   conversion* → clicks carrying a booking (NULL on every other click)
#
# Cumulative revenue variants (same scoping logic, but SUM not COUNT):
#   *CumulativePerUser    → total revenue accumulated for this user lifetime
#   *CumulativePerSession → total revenue accumulated within this session
#   *CumulativePerSearch  → total revenue accumulated within this search
#
# ⚠️ NO USER KEY → THE WHOLE BLOCK GOES NULL AT ONCE. Every event-scoped rank and
#    cumulative column is gated on `jetuser IS NOT NULL` in the ETL, family or not,
#    so a row without a user key carries NULL in all of them together. Week
#    2026-09-13→19: 2.70% of searches (41,574 of 1,541,346 — always PerSession and
#    PerUser together, no partial case), 0 on clicks and 0 on sessions. A GROUP BY
#    or countIf over any rank column drops those rows silently.
#
# ⚠️ FAMILY-SCOPED COLUMNS — clickCore*/clickNotCore*, revenueCore/NotCore
#    Cumulative*, conversion*/commissionValueCalculatedCumulative*, at all
#    three scopes. Two traps, both verified on 2026-09 data and both visible in
#    the window functions that build them (jetcost-bi, resources/queries/etl2/
#    modeled_jc_clicks_data.sql, block "Rankings a livello di user - session -
#    search"). The catalog carries the same definitions: its descriptions for
#    attributes 1048-1080 were rewritten on 2026-09-22 and now state the NULL
#    rules and the per-category counting. Note that raw_catalog in ClickHouse is
#    a daily copy of it, so it keeps serving the old boilerplate until the next
#    sync. What lives only here is the operational side below — the measured
#    NULL shares, and what can and cannot be derived from the differences.
#
#   1. NULL OUTSIDE THE FAMILY. A Core column is NULL on every non-Core click,
#      a NotCore column is NULL on every Core click, and conversion*/commission*
#      are NULL on every click without a booking — 100%, no exception (week
#      2026-09-13→19: 435,030 non-Core, 282,612 Core, 712,794 non-converting
#      clicks). So count()/avg() over one of these columns silently drops the
#      other family, and WHERE clickCoreRankPerSession = 1 excludes every MAL
#      click instead of selecting the session's first Core click. The all-clicks
#      columns (clickRank*, revenueCumulative*) never go NULL this way — only
#      through the user-key gate above.
#
#   2. COUNTED PER clickCategory, NOT PER FAMILY. The split is hardcoded on
#      clickCategory = 1001 / != 1001 — NOT on clickCategoryMacroType, so MAL
#      Core (3003) counts as NotCore, and 5001 (macro-type Core, never seen
#      since 2023) would count as NotCore too — and the window partitions by
#      clickCategory. A NotCore column therefore restarts at 1 for EACH non-Core
#      category: a session with a MAL Exit Unit (4002) click and a MAL Promobox
#      (3003) click carries clickNotCoreRankPerSession = 1 on both. It is the
#      N-th click of THIS click's own category, never the N-th non-Core click
#      (verified 2026-09-16: exact, 0 exceptions in 68,485 rows; 5.2% of sessions
#      with non-Core clicks span two categories). Core is immune only because it
#      is a single category. The revenue*Cumulative* variants inherit the same
#      partition: a per-category running total, not a per-family one — in the
#      2,446 sessions holding two non-Core categories, summing the per-category
#      maxima reproduces revenueCumulativePerSession in 2,446 cases and reading
#      the two family columns as if they covered the whole family in 0.
#
#   SEQUENCING Core vs MAL INSIDE A SESSION. No datamart exposes a usable
#   session key — the only column carrying session ids is the unverified
#   diagnostic array userSessionEnhancedHistoryLast90Days — so the rows of one
#   session cannot be grouped and ordered. The only per-row handle is
#      clickRankPerSession - <family rank>
#        = how many clicks of OTHER categories preceded this one in the session.
#   On a Core click that is exactly "how many MAL clicks came first" (0 breaks in
#   44,440 Core clicks, 2026-09-16), because Core is one category. On a MAL click
#   it is NOT "how many Core clicks came first": it also counts the other MAL
#   categories, and is wrong on 5.5% of MAL clicks (3,756/68,443). The Core
#   clicks preceding a MAL click cannot be isolated at all.
#
#   SEARCH RANKS ARE THE SAFE CASE — trap 1 only. searchFlight/Car/DpRank* have
#   the identical shape (modeled_jc_searches_data.sql: `if(product = 'FLIGHT',
#   ROW_NUMBER() OVER (PARTITION BY jetuser, product, jetsess ...), NULL)`), so
#   they are 100% NULL outside their own product — verified on FLIGHT and CAR —
#   but trap 2 does NOT apply: here the partition key IS the family, so each
#   counter is exact and the subtraction is reliable.
#     searchRankPerSession - searchFlightRankPerSession
#       = how many non-FLIGHT searches preceded this one in the session
#   (0 breaks in 220,613 flight and 1,531 car searches, 2026-09-16). Same for
#   conversionRank*/commission*, gated on hasConversion = 1 with an equally
#   no-op partition: exact counters, trap 1 only (conversionRankPerSession equals
#   the click's position among the session's converting clicks on 13,773 of
#   13,774, 2026-09-01→20).
#
# Typical use cases:
#   - Funnel depth analysis: GROUP BY searchRankPerSession to see how engagement
#     drops off with successive searches in a session
#   - User lifecycle segmentation: WHERE userSearchFlightRankPerUser IS NULL AND
#     searchFlightRankPerSession = 1 to isolate first-ever flight searches — NOT
#     `= 1`, which excludes every genuine first-timer (see the ⚠️ on the user*
#     prefix above)
#   - Session quality: WHERE clickRankPerSearch >= 2 to find multi-click searches
# ============================================================


