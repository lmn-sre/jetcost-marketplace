      #     conversionsProRataGAds on OIA app sessions is an allocation by sessions,
      #     not the conversions Google measured in the app (android-/ios-core-sgtm).
      # Ds and NotSem keep OIA app sessions at 0: Bing OIA app sessions are under
      # 0.1% of Bing OIA sessions.
      - column_name: clicksProRataGAds
      - column_name: impressionsProRataGAds
      - column_name: conversionsProRataGAds
      - column_name: costProRataGAds
      - column_name: clicksProRataDs
      - column_name: impressionsProRataDs
      - column_name: costProRataDs
      - column_name: costProRataNotSem
