      # --- Country cluster (3 attribution models) ---
      # Physical columns on datamart.jc_sessions_datamart_view since 2026-09-09
      # (jetcost-bi task 86cbam9e2). Until then they were computed dimensions in
      # computed.yml; the mapping now has exactly ONE definition, the view's DDL
      # (jetcost-bi resources/queries/datamart/jc_sessions_datamart_view_create.sql),
      # which is also what Superset dataset 11 serves. Do NOT re-add a computed
      # copy here — two definitions of this mapping is precisely what this move
      # was meant to end.
      # A fourth column, sessionContentCountryCluster, was removed from the
      # view's DDL on 2026-09-25: do not look for it or rebuild it.
      # Each column maps a country-language locale into macro clusters: LATAM,
      # GERMANIC, NORDICS, OTHER-EU; single-market IT, FR, ES, UK, NL, PT, IE,
      # CA-EN, CA-FR; US split by Local/Ext into US-EN-LOC, US-EN-EXT, US-ES-LOC,
      # US-ES-EXT; plus the RoW fallback. 18 distinct values over 2026-09-01..27.
      # Which locale is used depends on the campaign of that attribution model:
      #   - real campaigns: the campaign's own *CountryDetail and *LocalVsExt,
      #     i.e. the market-locale the campaign targets;
      #   - campaigns flagged `technical` in the campaign registry (the 24 vrt_*
      #     virtual campaigns of direct, referral, AI assistant referral
      #     (vrt_ai_assistant_*, since 2026-10-22), organic and not-found traffic,
      #     ~76% of sessions) have no target of their own — their CountryDetail
      #     reads 'undefined' — so the SESSION's market is used instead
      #     (country + language), with LOC/EXT from `Country - Is Local`.
      # The view computes this at query time from the current registry, so the
      # rule applies to the whole history, not from a date onwards.
      # Which column to use depends on the attribution model being analysed — see
      # ATTRIBUTION MODELS in the glossary above.
      # ⚠️ 'RoW' is the FALLBACK bucket, not a market group: every locale the
      # mapping does not name lands there. Share of sessions in RoW over
      # 2026-09-01..27: sessionCampaign 11,32%, lastClickNotDirectCampaign 11,33%,
      # userBasedCampaign 11,60% (sessionCampaign on paid 0,38%, on notpaid
      # 14,57%). 99% of it is technical-campaign traffic on markets the mapping
      # does not group: in-en, sg-en, za-en, au-en, th-en, nz-en, hk-en, ph-en,
      # id-en, my-en, kr-ko, and also ve-es, uy-es, bo-es (~0,3M sessions), which
      # are Latin American but NOT in LATAM (LATAM is ar, br, cl, co, mx, pe
      # only). Never report RoW as a market: break it down by `country` and
      # `language` first.
      # ⚠️ Until 2026-09-28 the cluster used CountryDetail for every campaign, so
      # all non-campaign traffic sat in RoW (~75% of sessions) and the cluster was
      # only usable on paid. Numbers, notes or queries from before that date
      # that filter to paid "because RoW is polluted" are no longer needed.
      # ⚠️ CountryDetail is the CAMPAIGN's target market-locale, NOT the session's
      # market (`country`/`language`) and NOT the user's geography (`countryUser`).
      # EXT campaigns buy users outside the target market on purpose, so one value
      # spreads over many markets, and the field carries locales that are not
      # Jetcost markets at all ('be-fr', 'ch-fr', 'ma-fr', 'de-tr', 'cr-es'). Never
      # use it as a market list or as a proxy for market — group by `country` (plus
      # `language` for US and CA) when the question is about the market. See
      # core/business/markets.md in the domain bundle. The cluster inherits this
      # on real campaigns only: on technical ones it IS the session's market, so
      # one column mixes the two notions — split by *PaidVsNotPaid when that
      # matters.
      # ⚠️ NORDICS is small because the Nordics carry little SEM spend, NOT
      # because of a mapping gap — do not read a small NORDICS as a data defect.
      # Until 2026-09-19 every Nordic CountryDetail value read 0 cost; from the
      # week of 2026-09-20 dk-da carries paid search (a few hundred to ~1,400 EUR
      # a week through mid-October 2026), se-sv had one week, no-* and fi-fi none.
      # ⚠️ sessions ONLY. These three columns live on the sessions view and on no
      # other datamart, so searches, clicks and impressions each exclude them
      # under `not_inherited_dimensions`.
      - column_name: sessionCampaignCountryCluster
      - column_name: userBasedCampaignCountryCluster
      - column_name: lastClickNotDirectCampaignCountryCluster

      # --- Diagnostic / unverified ---
