      - column_name: heroPartnerCode
      - column_name: heroGroupCode
      - column_name: sortingPosition
      - column_name: heroUnitaryPrice
      - column_name: heroDiscountedUnitaryPrice
      - column_name: heroTotalPrice
      - column_name: heroDiscountedTotalPrice
      - column_name: heroDiscount
      - column_name: heroPaymentMethod
      - column_name: heroPaymentMethodFees
      - column_name: heroPaymentMethodFeesCount
      - column_name: heroPaymentMethodFeesCountZero
      - column_name: heroPaymentMethodFeesCountNotZero
      - column_name: heroPaymentMethodFeesMax
      - column_name: heroPartnerQualityValidSurveysNumber
      - column_name: heroPartnerQualityScore
      - column_name: heroIsAirline           # hero offer: partner is an airline. Nullable(Bool), FLIGHT only.
      #   Web: populated for the whole retained window — NULL there means only that the impression has no hero partner (non-itinerary impressionTypes); the NULL count matches heroPartnerCode exactly.
      #   App: NULL before v4.46.0 — first non-NULL 2026-06-18, ramping through July 2026, so an app cut over the earlier part of the window returns nothing. Same airline-vs-OTA caveat as the clicks entry above.
      - column_name: isSelfTransfer        # itinerary-level self transfer flag (attr 1257); same value across all offers
      - column_name: heroIsSponsored
      - column_name: isUniqueContent
      - column_name: area
      - column_name: transportationType
      - column_name: filters
      - column_name: filterStepCount          # Client-side (Argo): number of filter interactions before this click/impression. Can be > 0 with filtersApplied = 0 (filters touched, then removed)
      - column_name: filtersApplied           # Client-side (Argo): number of filters active at click/impression time (the list is in `filters`). A state, not an interaction count — see filterStepCount
      # --- Itinerary legs ---
      # Itinerary-level, not offer-level: same value across all offers of the row.
